<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tack</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;400;600;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="app-layout">
        <aside class="panel">
            <small class="brand-label">TACK</small>
            
            <button class="btn-new-task" onclick="abrirModal()">
                + NUEVA TAREA
            </button>
            
            <div id="listaTareas" class="tareas-list-container">
                </div>

            <button class="btn-focus-mode" onclick="toggleFullScreen()">
                FOCUS MODE
            </button>
        </aside>

        <main class="main-content">
            <div id="viewTimer" class="timer-wrapper">
                
                <div id="breakOverlay" class="break-overlay">
                    <div class="text-center">
                        <div id="breakIcon" style="font-size: 3rem;">🍱</div>
                        <h2 id="breakTimer" style="font-size: 5rem; font-weight: 100; color: var(--info);">00:00</h2>
                        <button class="btn-tack btn-pause mt-4" onclick="terminarBreak()">
                            REANUDAR FLUJO
                        </button>
                    </div>
                </div>

                <div class="tack-card">
                    <div id="focusRing" class="focus-ring-container">
                        <div class="d-flex align-items-center justify-content-center gap-5">
                            
                            <div class="session-metrics text-end">
                                <div class="metric-item">
                                    <small style="letter-spacing: 2px; color: #1a1a1a; font-size: 0.5rem; font-weight: 800;">BREAKS</small>
                                    <h4 id="countBreaks" style="font-weight: 100;">0</h4>
                                </div>
                                <div class="metric-item mt-3">
                                    <small style="letter-spacing: 2px; color: #1a1a1a; font-size: 0.5rem; font-weight: 800;">STRETCH</small>
                                    <h4 id="countStretch" style="font-weight: 100;">0</h4>
                                </div>
                            </div>

                            <div class="timer-core">
                                <div class="real-time-clock" id="realClock">00:00:00</div>
                                <small id="taskLabel" class="current-task-name">STANDBY</small>
                                <div class="timer" id="display">
                                    00:00:00<span class="mili">00</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="controls-wrapper mt-5">
                        <div class="d-flex gap-3 justify-content-center">
                            <button id="startBtn" class="btn-tack btn-start" onclick="controlTimer('start')" disabled>START</button>
                            <button id="pauseBtn" class="btn-tack btn-pause" onclick="controlTimer('pause')" disabled>PAUSE</button>
                            <button id="stopBtn" class="btn-tack btn-stop" onclick="controlTimer('stop')" disabled>STOP</button>
                        </div>

                        <div class="d-flex gap-2 justify-content-center mt-3">
                            <button class="btn-quick-action" onclick="iniciarBreak('ALMUERZO')">LUNCH</button>
                            <button id="btnStretch" class="btn-quick-action" onclick="iniciarBreak('STRETCH')">STRETCH</button>
                            <button class="btn-quick-action" onclick="iniciarBreak('BAÑO')">BAÑO</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <div class="side-monitors">
            <div class="monitor-bar">
                <div id="waterFill" class="fill-water"></div>
            </div>
            <div class="icon-water" onclick="addWater()" title="Registrar Hidratación">💧</div>
            
            <div class="monitor-bar">
                <div id="loadFill" class="fill-load"></div>
            </div>
        </div>
    </div>

    <div id="modalTarea" class="modal-overlay-custom">
        <div class="modal-card-dark">
            <h6 class="text-center mb-4" style="letter-spacing: 3px; font-size: 0.6rem; color: #444;">NUEVA TAREA</h6>
            
            <input type="text" id="mNombre" placeholder="NOMBRE DE LA TAREA" class="modal-input" autocomplete="off">
            
            <select id="mPostura" class="modal-select">
                <option value="sentado">POSTURA: SENTADO</option>
                <option value="pie">POSTURA: DE PIE</option>
            </select>
            
            <div class="d-flex gap-2 mt-4">
                <button class="btn-tack w-100" style="background: #151515; color: #444;" onclick="cerrarModal()">CANCELAR</button>
                <button class="btn-tack btn-start w-100" onclick="procesarTarea()">GUARDAR</button>
            </div>
        </div>
    </div>

    <script src="./render.js"></script>
</body>
</html>
